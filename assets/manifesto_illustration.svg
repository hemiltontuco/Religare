<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 900" role="img" aria-labelledby="title desc">
  <title id="title">Ilustracao abstrata inspirada no manifesto Religare</title>
  <desc id="desc">Paisagem simbolica com sol, caminhos, montanhas, circulos e pequenas luzes convergindo para um centro comum.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#efe4d4"/>
      <stop offset="0.45" stop-color="#dcc9b6"/>
      <stop offset="1" stop-color="#9a7b62"/>
    </linearGradient>
    <radialGradient id="sunGlow" cx="50%" cy="44%" r="43%">
      <stop offset="0" stop-color="#fff2c6"/>
      <stop offset="0.35" stop-color="#d39b47" stop-opacity="0.74"/>
      <stop offset="1" stop-color="#d39b47" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5d4739" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#1f1b18" stop-opacity="0.92"/>
    </linearGradient>
    <filter id="soften">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.75" numOctaves="3" seed="12"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncA type="table" tableValues="0 0.08"/>
      </feComponentTransfer>
    </filter>
  </defs>

  <rect width="1920" height="900" fill="url(#sky)"/>
  <rect width="1920" height="900" fill="url(#grain)" opacity="0.42"/>
  <circle cx="960" cy="372" r="390" fill="url(#sunGlow)"/>
